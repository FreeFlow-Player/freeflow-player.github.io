<!DOCTYPE html lang="en">
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        padding: 0;
        background: #242323;
      }
    .hero {
      position: relative;
      width: 95vw;
      height: 50vh;
      overflow: hidden;
      margin-left: 2.5%;
      margin-top: 3%;
      border-radius: 20px;
    }

    .hero img {
      width: 95vw;
      height: 58vh;
      object-fit: cover;
      object-position: center;
      transform: translateY(-8vh);
      display: block;
      margin-left: -1%;
      border-radius: 20px;
    }
    nav {
      background-color: #4e4c4c;
      height: 75px;
      width: 95%;
      margin-left: 2.5%;
      border-radius: 10px;
    }
    </style>
  </head>
  <body>
    <nav>
      <h1>Hi</h1>
    </nav>
    <header>
      <div class="hero">
        <img src="hero-img.webp" alt="Hero Image">
      </div>
    </header>
  </body>
</html>
